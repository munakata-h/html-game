<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Score Attack Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--gold:#ffd700;--white:#fff;--red:#ff3232;--navy:#000080;--green:#00cc55;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;font-family:'Press Start 2P',monospace;color:#fff;overflow:hidden;}
#ui{width:1024px;display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-size:11px;color:var(--gold);text-shadow:0 0 8px var(--gold);}
#canvas-wrap{position:relative;border:2px solid var(--gold);box-shadow:0 0 20px rgba(255,215,0,0.4);}
canvas{display:block;}
#controls{margin-top:8px;font-size:9px;color:#668;text-align:center;}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.82);z-index:10;gap:20px;}
#overlay h1{font-size:24px;color:var(--gold);text-shadow:0 0 16px var(--gold);animation:pulse 1s ease-in-out infinite alternate;}
#overlay p{font-size:10px;color:#ccc;line-height:2.4;text-align:center;}
#overlay button{font-family:'Press Start 2P',monospace;font-size:12px;background:transparent;border:2px solid var(--green);color:var(--green);padding:12px 28px;cursor:pointer;text-shadow:0 0 8px var(--green);box-shadow:0 0 12px var(--green);animation:blink 1.2s step-end infinite;}
#overlay button:hover{background:var(--green);color:#000;text-shadow:none;}
@keyframes pulse{from{opacity:.7;transform:scale(.98)}to{opacity:1;transform:scale(1.02)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* スマホ縮小対応 */
#scale-wrap{transform-origin:top left;width:1024px;position:relative;left:0;}
/* タッチボタン（スマホのみ、scale-wrapの外に置くため縮小されない） */
#touch-controls{display:none;justify-content:space-between;align-items:center;width:100vw;padding:10px 16px;user-select:none;box-sizing:border-box;position:fixed;bottom:0;left:0;z-index:100;background:rgba(0,0,0,0.4);}
@media (pointer:coarse){#touch-controls{display:flex;}#controls{display:none;}}
.touch-btn{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;cursor:pointer;color:#fff;-webkit-tap-highlight-color:transparent;touch-action:none;}
.touch-btn.active{background:rgba(255,255,255,0.35);}
#touch-jump{width:80px;height:80px;border-color:rgba(255,215,0,0.7);background:rgba(255,215,0,0.12);}
#touch-jump.active{background:rgba(255,215,0,0.4);}
</style>
</head>
<body>
<div id="scale-wrap">
<div id="ui">
  <span>SCORE: <span id="score-display">100</span></span>
  <span>Score Attack Adventure</span>
  <span>TIME: <span id="time-display">60</span></span>
</div>
<div id="canvas-wrap">
  <canvas id="gameCanvas" width="1024" height="728"></canvas>
  <div id="overlay">
    <h1>STAGE 1</h1>
    <p>← → : 移動<br>スペース / ↑ : ジャンプ<br>上の足場へ連続で乗るとコンボ倍率UP！<br>下がるとコンボリセット＆-80点<br>落下は-200点（マイナスあり）<br>ゴール（金色の旗）を目指せ！</p>
    <button onclick="startGame()">▶ スタート（またはEnter）</button>
  </div>
</div>
<div id="controls">← → : 移動 &nbsp;|&nbsp; SPACE / ↑ : ジャンプ</div>
</div>
<div id="touch-controls">
  <div style="display:flex;gap:10px;">
    <div class="touch-btn" id="touch-left">◀</div>
    <div class="touch-btn" id="touch-right">▶</div>
  </div>
  <div class="touch-btn" id="touch-jump">▲<br><span style="font-size:9px;font-family:'Press Start 2P',monospace;">JUMP</span></div>
</div>

const player={x:50,y:620,w:45,h:60,velY:0,onGround:false,facingRight:true,animeCount:0,lastPlatformY:680};
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  // Enterキーでスタートボタンをクリック
  if(e.code==='Enter'){
    const ov=document.getElementById('overlay');
    if(ov.style.display!=='none'){
      const btn=ov.querySelector('button');
      if(btn)btn.click();
    }
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);
let score=100,startTime=null,gameRunning=false,gameResult=null;
let comboCount=0; // 連続上昇カウント（倍率計算用）
let gainedText='',gainedAt=0; // 獲得ポイント表示用（独立変数）

function resetPlayer(){player.x=50;player.y=620;player.velY=0;player.onGround=false;player.facingRight=true;player.lastPlatformY=680;player.animeCount=0;comboCount=0;gainedText='';gainedAt=0;}

function startGame(){
  score=parseInt(localStorage.getItem('gameScore')||'100');
  resetPlayer();gameResult=null;gameRunning=true;
  startTime=performance.now();
  document.getElementById('overlay').style.display='none';
  updateUI(LIMIT_TIME);
}

function drawPlayer(x,y,facingRight,moving,onGround,animeCount){
  let img=img1;
  if(!onGround)img=img2;
  else if(moving)img=(Math.floor(animeCount/8)%2===0)?img2:img3;
  ctx.save();
  if(!facingRight){ctx.translate(x+player.w,0);ctx.scale(-1,1);ctx.drawImage(img,0,y,player.w,player.h);}
  else ctx.drawImage(img,x,y,player.w,player.h);
  ctx.restore();
}

function drawGoal(x,y,w,h){
  ctx.save();
  // 光る台座
  ctx.fillStyle='rgba(255,215,0,0.25)';
  ctx.beginPath();ctx.ellipse(x+w/2,y+h+6,28,8,0,0,Math.PI*2);ctx.fill();

  // ポール
  ctx.fillStyle=GOLD;ctx.shadowColor=GOLD;ctx.shadowBlur=16;
  ctx.fillRect(x+w/2-3,y,6,h);

  // 旗
  ctx.fillStyle=RED;ctx.shadowColor=RED;ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(x+w/2+3,y+4);ctx.lineTo(x+w/2+32,y+16);ctx.lineTo(x+w/2+3,y+28);ctx.closePath();ctx.fill();

  // 「GOAL」文字
  ctx.shadowBlur=10;ctx.shadowColor=GOLD;
  ctx.fillStyle=GOLD;ctx.font='bold 13px "Press Start 2P",monospace';ctx.textAlign='center';
  ctx.fillText('GOAL',x+w/2+6,y-10);

  // 上下に光るパルス（frameで点滅）
  const alpha=0.4+0.4*Math.sin(Date.now()/300);
  ctx.fillStyle='rgba(255,215,0,'+alpha+')';
  ctx.beginPath();ctx.arc(x+w/2,y-22,6,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;ctx.textAlign='left';
  ctx.restore();
}

function drawPlatform(p){
  ctx.fillStyle=BROWN;ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='#228822';ctx.fillRect(p.x,p.y,p.w,Math.min(6,p.h));
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(p.x,p.y,p.w,2);
}

function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}

function update(elapsed){
  if(!gameRunning||gameResult)return;
  const timeLeft=Math.max(0,LIMIT_TIME-elapsed);
  const moving=keys['ArrowLeft']||keys['ArrowRight'];
  if(keys['ArrowLeft']){player.x-=PLAYER_SPEED;player.facingRight=false;}
  if(keys['ArrowRight']){player.x+=PLAYER_SPEED;player.facingRight=true;}
  player.x=Math.max(0,Math.min(W-player.w,player.x));
  if((keys['Space']||keys['ArrowUp'])&&player.onGround){player.velY=JUMP_POWER;player.onGround=false;}
  player.velY+=GRAVITY;player.y+=player.velY;player.onGround=false;
  for(const p of LEVEL_DATA){
    if(rectsOverlap(player.x,player.y,player.w,player.h,p.x,p.y,p.w,p.h)){
      if(player.velY>0&&player.y+player.h-player.velY<=p.y+2){
        player.y=p.y-player.h;
        if(p.y<player.lastPlatformY){
          // 上の足場へ：高さに応じた得点 × コンボ倍率
          const heightDiff=player.lastPlatformY-p.y;
          const basePoints=Math.floor(heightDiff/50)*2+6; // 高さ差に比例した基本点
          comboCount++;
          const multiplier=Math.min(comboCount,5); // 最大5倍
          const gained=basePoints*multiplier;
          score+=gained;
          // コンボ表示用（draw内で参照）
          gainedText='+'+gained+(multiplier>1?' x'+multiplier+'コンボ!':'');
          gainedAt=Date.now();
        }else if(p.y>player.lastPlatformY){
          // 下の足場へ：減点 & コンボリセット
          comboCount=0;
          score-=80;
          gainedText='-80 コンボリセット';
          gainedAt=Date.now();
        }else{
          // 同じ足場：何もしない（表示はそのまま維持）
        }
        player.lastPlatformY=p.y;player.velY=0;player.onGround=true;
      }else if(player.velY<0){player.y=p.y+p.h;player.velY=0;}
    }
  }
  if(moving)player.animeCount++;else player.animeCount=0;
  if(player.y>720){
    // 落下：-200点、マイナス許容、コンボリセット
    player.x=50;player.y=620;player.velY=0;
    comboCount=0;
    score-=200;
    gainedText='-200 落下！';
    gainedAt=Date.now();
  }
  for(const g of GOALS){
    if(rectsOverlap(player.x,player.y,player.w,player.h,g.x,g.y,g.w,g.h)){endGame('CLEAR');return;}
  }
  if(timeLeft<=0){endGame('TIME_UP');return;}
  updateUI(timeLeft);
}

function draw(elapsed){
  const timeLeft=Math.max(0,LIMIT_TIME-elapsed);
  ctx.fillStyle=SKY;ctx.fillRect(0,0,W,H-40);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,H-40,W,40);
  ctx.fillStyle='rgba(255,255,255,0.7)';
  [[150,80,60,30],[400,50,80,35],[700,90,55,28],[900,60,70,32]].forEach(([cx,cy,cw,ch])=>{
    ctx.beginPath();ctx.ellipse(cx,cy,cw,ch,0,0,Math.PI*2);ctx.fill();
  });
  LEVEL_DATA.forEach(drawPlatform);
  GOALS.forEach(g=>drawGoal(g.x,g.y,g.w,g.h));
  drawPlayer(player.x,player.y,player.facingRight,keys['ArrowLeft']||keys['ArrowRight'],player.onGround,player.animeCount);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,H-40,W,40);
  ctx.fillStyle=WHITE;ctx.font='11px "Press Start 2P",monospace';ctx.textAlign='center';
  ctx.fillText('操作：矢印キーで移動 ＆ スペースでジャンプ',W/2,H-16);
  ctx.fillStyle=BLACK;ctx.font='bold 28px "Press Start 2P",monospace';ctx.textAlign='center';
  ctx.fillText('SCORE: '+score,W/2,44);
  // TIMEバー（SCORE直下、y=58）
  const barW=400,barX=(W-barW)/2;
  ctx.strokeStyle=WHITE;ctx.lineWidth=2;ctx.strokeRect(barX,58,barW,18);
  ctx.fillStyle=timeLeft<10?RED:NAVY;
  ctx.fillRect(barX,58,(timeLeft/LIMIT_TIME)*barW,18);
  // コンボ倍率表示（右上コーナー）
  if(comboCount>1){
    const mult=Math.min(comboCount,5);
    ctx.fillStyle='rgba(255,215,0,0.95)';ctx.font='bold 13px "Press Start 2P",monospace';
    ctx.textAlign='right';
    ctx.fillText('COMBO x'+mult,W-12,28);
    ctx.textAlign='center';
  }
  // 獲得ポイントをプレイヤーの真上にフローティング表示（10秒、次の獲得で上書き）
  const GAINED_DURATION=10000; // 10秒
  const gainedAge=gainedAt>0?Date.now()-gainedAt:GAINED_DURATION;
  if(gainedAge<GAINED_DURATION&&gainedText){
    // 最後の2秒だけフェードアウト
    const fadeStart=GAINED_DURATION-2000;
    const alpha=gainedAge>fadeStart?1-(gainedAge-fadeStart)/2000:1;
    // 最初の1秒だけ上へ浮かび上がる
    const rise=Math.min(gainedAge/1000,1)*30;
    const isPos=gainedText.startsWith('+');
    const px=Math.max(120,Math.min(W-120,player.x+player.w/2));
    const py=Math.max(110,player.y-rise);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.font='bold 15px "Press Start 2P",monospace';
    ctx.textAlign='center';
    ctx.shadowColor=isPos?'#00cc44':'#ff2222';
    ctx.shadowBlur=10;
    ctx.fillStyle=isPos?'#00ff66':'#ff4444';
    ctx.fillText(gainedText,px,py);
    ctx.shadowBlur=0;
    ctx.restore();
  }
  if(gameResult){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=GOLD;ctx.font='56px "Press Start 2P",monospace';ctx.textAlign='center';
    ctx.fillText(gameResult==='CLEAR'?'GOAL!!':'TIME UP',W/2,H/2-40);
    ctx.fillStyle=WHITE;ctx.font='32px "Press Start 2P",monospace';
    ctx.fillText('SCORE: '+score,W/2,H/2+40);
  }
  ctx.textAlign='left';
}

function endGame(result){
  gameResult=result;gameRunning=false;
  localStorage.setItem('gameScore',score);

  setTimeout(()=>{
    const ov=document.getElementById('overlay');
    ov.innerHTML='<h1 style="color:'+(result==='CLEAR'?'#ffd700':'#ff3232')+'">'+(result==='CLEAR'?'GOAL!!':'TIME UP')+'</h1><p style="font-size:14px;color:#fff;">SCORE: '+score+'</p><button onclick="startGame()">▶ もう一度</button>';
    ov.style.display='flex';

    // 2秒経って「GOAL!!」の画面が出た瞬間に、親画面へ進む合図を送ります
    if(result==='CLEAR'){
      // セキュリティ制限をすり抜けるため、自分自身の窓口から親画面のリスナーへイベントを直接発火させます
      window.dispatchEvent(new MessageEvent('message', { data: 'stageClear' }));
      window.parent.postMessage({ type: 'stageClear' }, '*');
    }

  },1500);
}

function updateUI(timeLeft){
  document.getElementById('score-display').textContent=score;
  if(timeLeft!==undefined)document.getElementById('time-display').textContent=Math.ceil(timeLeft);
}

function loop(ts){
  const elapsed=startTime?(ts-startTime)/1000:0;
  update(elapsed);draw(elapsed);
  requestAnimationFrame(loop);
}
updateUI(LIMIT_TIME);
requestAnimationFrame(loop);

// ---- スマホ縮小スケール（CSSのtransformで縮小、leftで中央寄せ） ----
(function(){
  function applyScale(){
    const wrap=document.getElementById('scale-wrap');
    const vw=window.innerWidth;
    const ratio=Math.min(1, vw/1024);
    const scaledH=wrap.scrollHeight*ratio;
    wrap.style.transform='scale('+ratio+')';
    // transform-origin:top left なので、右余白を相殺するためleftでセンタリング
    wrap.style.left=((vw - 1024*ratio)/2)+'px';
    // 縮小後の実際の高さに合わせてbodyの高さを調整（下に余白が出るのを防ぐ）
    wrap.style.marginBottom=(scaledH - wrap.scrollHeight)+'px';
  }
  applyScale();
  window.addEventListener('resize', applyScale);
})();

// ---- タッチボタン操作 ----
(function(){
  function bindTouch(id,code){
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('touchstart',e=>{e.preventDefault();keys[code]=true;el.classList.add('active');},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();keys[code]=false;el.classList.remove('active');},{passive:false});
    el.addEventListener('touchcancel',()=>{keys[code]=false;el.classList.remove('active');});
  }
  bindTouch('touch-left','ArrowLeft');
  bindTouch('touch-right','ArrowRight');
  bindTouch('touch-jump','Space');
})();
</script>
